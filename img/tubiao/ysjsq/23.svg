<svg xmlns="http://www.w3.org/2000/svg" viewBox="350 160 350 320">
  <defs>
    <!-- 双层霓虹发光滤镜 -->
    <filter id="neon" x="-80%" y="-80%" width="260%" height="260%">
      <!-- 外层：宽范围青色氛围光 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="glow1"/>
      <feFlood flood-color="#06b6d4" flood-opacity="0.7" result="c1"/>
      <feComposite in="c1" in2="glow1" operator="in" result="outer"/>
      
      <!-- 中层：聚焦亮青 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="glow2"/>
      <feFlood flood-color="#67e8f9" flood-opacity="0.9" result="c2"/>
      <feComposite in="c2" in2="glow2" operator="in" result="mid"/>
      
      <!-- 内层：极亮白芯 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="glow3"/>
      <feFlood flood-color="#ecfeff" flood-opacity="1" result="c3"/>
      <feComposite in="c3" in2="glow3" operator="in" result="inner"/>
      
      <!-- 合成：外光 + 中光 + 内芯 + 原图 -->
      <feMerge>
        <feMergeNode in="outer"/>
        <feMergeNode in="mid"/>
        <feMergeNode in="inner"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g transform="translate(0,661) scale(0.1,-0.1)" filter="url(#neon)">
